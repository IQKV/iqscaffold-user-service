# Development Environment Configuration (Kubernetes)
# This configuration is for development deployment in Kubernetes cluster
# Uses infrastructure services from foundation-infra Helm chart
#
# Logging Configuration (via environment variables):
# LOG_LEVEL_ROOT=INFO
# LOG_LEVEL_APP=DEBUG
# LOG_LEVEL_SPRING=DEBUG
# LOG_LEVEL_SECURITY=DEBUG
# LOG_LEVEL_SQL=DEBUG
# LOG_LEVEL_HIKARI=DEBUG
# LOG_LEVEL_MESSAGING=DEBUG
# LOG_FORMAT=TEXT

spring:
  jpa:
    show-sql: true

iqscaffold:
  database:
    url: ${IQSCAFFOLD_DATABASE_URL:jdbc:postgresql://foundation-infra-postgresql.iqkv-sit-env.svc.cluster.local:5432/iqscaffold_user}
    username: ${IQSCAFFOLD_DATABASE_USERNAME:svc_user_sit_dba}
    password: ${IQSCAFFOLD_DATABASE_PASSWORD:iqkv_password}

  cache:
    redis:
      host: ${IQSCAFFOLD_CACHE_REDIS_HOST:foundation-infra-redis-master.iqkv-sit-env.svc.cluster.local}
      password: ${IQSCAFFOLD_CACHE_REDIS_PASSWORD:iqkv_password}
      key-prefix: "iqscaffold:auth:dev"
      enable-statistics: true

  messaging:
    rabbitmq:
      host: ${IQSCAFFOLD_MESSAGING_RABBITMQ_HOST:foundation-infra-rabbitmq.iqkv-sit-env.svc.cluster.local}
      username: ${IQSCAFFOLD_MESSAGING_RABBITMQ_USERNAME:svc_infra_sit_rmq}
      password: ${IQSCAFFOLD_MESSAGING_RABBITMQ_PASSWORD:iqkv_password}

  auth:
    jwt:
      secret-key: ${JWT_SECRET_KEY:dev-secret-key-not-for-production-use-only}
      access-token-expiry: PT30M
      issuer: iqscaffold-user-service-dev
      audience: iqscaffold-services-dev
    security:
      password:
        require-special-chars: false
        min-length: 6
      rate-limiting:
        login-attempts: 10
        lockout-duration: PT5M
      session:
        timeout: PT4H
        concurrent-sessions: 3

  email:
    smtp:
      host: ${SMTP_HOST:foundation-infra-mailhog.iqkv-sit-env.svc.cluster.local}
      port: ${SMTP_PORT:1025}
      auth: false
      starttls: false
    sender:
      from-email: ${EMAIL_FROM_EMAIL:noreply@iqscaffold.com}
      from-name: ${EMAIL_FROM_NAME:IQ Key Value Platform (Dev)}
      base-url: ${APP_BASE_URL:https://app.iqscaffold.com}
      auth-base-url: ${AUTH_BASE_URL:https://auth.iqscaffold.com}
    verification:
      rate-limit: 5
    templates:
      verification-subject: "[DEV] Verify your IQ Key Value account"
      password-reset-subject: "[DEV] Reset your IQ Key Value password"
      password-reset-confirmed-subject: "[DEV] Password Reset Successful - IQ Key Value"
      registration-confirmed-subject: "[DEV] Welcome to IQ Key Value - Email Verified!"

  object-storage:
    endpoint: ${IQSCAFFOLD_OBJECTSTORAGE_ENDPOINT:http://foundation-infra-minio.iqkv-sit-env.svc.cluster.local:9000}
    access-key: ${IQSCAFFOLD_OBJECTSTORAGE_ACCESS_KEY:iqscaffold}
    secret-key: ${IQSCAFFOLD_OBJECTSTORAGE_SECRET_KEY:iqkv_password}

  # Enable demo data in dev environment
  liquibase:
    contexts: "demo"

  observability:
    metrics:
      prefix: iqscaffold_user_dev
      custom-tags:
        environment: dev
    logging:
      level: DEBUG
      enable-sql-logging: true
      enable-performance-logging: true
