# Local Development Environment Configuration
# This configuration is optimized for development with debug logging and relaxed security
#
# Logging Configuration (via environment variables):
# LOG_LEVEL_ROOT=INFO
# LOG_LEVEL_APP=DEBUG
# LOG_LEVEL_SPRING=DEBUG
# LOG_LEVEL_SECURITY=DEBUG
# LOG_LEVEL_SQL=DEBUG
# LOG_LEVEL_HIKARI=DEBUG
# LOG_LEVEL_MESSAGING=DEBUG
# LOG_FORMAT=TEXT

spring:
  jpa:
    show-sql: true

iqscaffold:
  database:
    url: ${IQSCAFFOLD_DATABASE_URL:jdbc:postgresql://localhost:5432/iqscaffold_user_local}

  cache:
    redis:
      key-prefix: "iqscaffold:auth:local"
      enable-statistics: true

  auth:
    jwt:
      secret-key: ${JWT_SECRET_KEY:local-development-secret-key-not-for-production-use}
      access-token-expiry: PT30M
      refresh-token-expiry: P30D
      issuer: iqscaffold-user-service-local
      audience: iqscaffold-services-local
    security:
      password:
        require-special-chars: false
        min-length: 6
      rate-limiting:
        login-attempts: 10
        lockout-duration: PT5M
      session:
        timeout: PT8H
        concurrent-sessions: 5

  email:
    smtp:
      port: ${SMTP_PORT:1025}
      auth: false
      starttls: false
    sender:
      from-email: ${EMAIL_FROM_EMAIL:noreply@iqscaffold.local}
      from-name: ${EMAIL_FROM_NAME:IQ  Key Value Platform (Local)}
      base-url: ${APP_BASE_URL:http://localhost:3000}
      auth-base-url: ${AUTH_BASE_URL:http://localhost:3001}
    verification:
      rate-limit: 10
    templates:
      verification-subject: "[LOCAL] Verify your IQ  Key Value account"
      password-reset-subject: "[LOCAL] Reset your IQ  Key Value password"
      password-reset-confirmed-subject: "[LOCAL] Password Reset Successful - IQ  Key Value"
      registration-confirmed-subject: "[LOCAL] Welcome to IQ  Key Value - Email Verified!"

  object-storage:
    bucket-name: ${IQSCAFFOLD_OBJECTSTORAGE_BUCKET_NAME:user-avatars-local}

  bootstrap:
    default-tenant:
      enabled: true
      tenant-id: default
      name: Local Development Tenant
      description: Local development tenant for testing
      max-users: 50
      storage-quota-gb: 10
      api-rate-limit: 10000

  # Enable manual tenant provisioning endpoints for development
  tenancy:
    manual-provisioning:
      enabled: true

  # Enable demo data in local environment
  liquibase:
    contexts: "demo"  # Run changesets with context="demo"

  observability:
    metrics:
      prefix: iqscaffold_user_local
      custom-tags:
        environment: local
    logging:
      level: DEBUG
      enable-sql-logging: true
      enable-performance-logging: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
