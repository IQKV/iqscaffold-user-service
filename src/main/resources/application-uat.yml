# UAT Environment Configuration
# This configuration is optimized for staging with moderate logging and security
#
# Logging Configuration (via environment variables):
# LOG_LEVEL_ROOT=INFO
# LOG_LEVEL_APP=INFO
# LOG_LEVEL_SPRING=WARN
# LOG_LEVEL_SECURITY=WARN
# LOG_LEVEL_SQL=WARN
# LOG_LEVEL_HIKARI=WARN
# LOG_LEVEL_MESSAGING=WARN
# LOG_FORMAT=JSON

spring:
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  data:
    redis:
      lettuce:
        pool:
          max-active: 16
          min-idle: 2

iqscaffold:
  database:
    url: ${IQSCAFFOLD_DATABASE_URL:jdbc:postgresql://postgres-staging:5432/iqscaffold_user_staging}
    password: ${IQSCAFFOLD_DATABASE_PASSWORD}
    pool:
      maximum-size: 20
      minimum-idle: 5

  cache:
    redis:
      host: ${IQSCAFFOLD_CACHE_REDIS_HOST:redis-staging}
      password: ${IQSCAFFOLD_CACHE_REDIS_PASSWORD}
      pool:
        max-active: 16
        min-idle: 2
      key-prefix: "iqscaffold:auth:staging"
      default-ttl: PT30M

  auth:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      issuer: iqscaffold-user-service-staging
      audience: iqscaffold-services-staging
    security:
      password:
        encoder-strength: 12
      session:
        timeout: PT4H
        concurrent-sessions: 3

  email:
    smtp:
      host: ${SMTP_HOST:smtp.gmail.com}
      username: ${SMTP_USERNAME}
      password: ${SMTP_PASSWORD}
    sender:
      from-email: ${EMAIL_FROM_EMAIL:noreply@iqscaffold.website}
      from-name: ${EMAIL_FROM_NAME:IQ  Key Value Platform (Staging)}
      base-url: ${APP_BASE_URL:https://iqscaffold.website}
      auth-base-url: ${AUTH_BASE_URL:https://auth.iqscaffold.website}
    templates:
      verification-subject: "[STAGING] Verify your IQ  Key Value account"
      password-reset-subject: "[STAGING] Reset your IQ  Key Value password"
      password-reset-confirmed-subject: "[STAGING] Password Reset Successful - IQ  Key Value"
      registration-confirmed-subject: "[STAGING] Welcome to IQ  Key Value - Email Verified!"

  object-storage:
    endpoint: ${IQSCAFFOLD_OBJECTSTORAGE_ENDPOINT:https://s3.staging.example.com}
    access-key: ${IQSCAFFOLD_OBJECTSTORAGE_ACCESS_KEY}
    secret-key: ${IQSCAFFOLD_OBJECTSTORAGE_SECRET_KEY}
    bucket-name: ${IQSCAFFOLD_OBJECTSTORAGE_BUCKET_NAME:user-avatars-staging}
    ssl: ${IQSCAFFOLD_OBJECTSTORAGE_SSL:true}

  observability:
    tracing:
      sampling-rate: 0.1
      endpoint: ${IQSCAFFOLD_OBSERVABILITY_TRACING_ENDPOINT:http://otel-collector:4317}
    metrics:
      prefix: iqscaffold_user_staging
      custom-tags:
        environment: staging
    logging:
      format: json

management:
  tracing:
    sampling:
      probability: 0.1

springdoc:
  swagger-ui:
    try-it-out-enabled: false
