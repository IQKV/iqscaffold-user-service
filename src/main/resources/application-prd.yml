# Production Environment Configuration
# This configuration is optimized for production with minimal logging and maximum security
# All sensitive values MUST be provided via environment variables or Kubernetes secrets
#
# Logging Configuration (via environment variables):
# LOG_LEVEL_ROOT=WARN
# LOG_LEVEL_APP=INFO
# LOG_LEVEL_SPRING=ERROR
# LOG_LEVEL_SECURITY=WARN
# LOG_LEVEL_SQL=ERROR
# LOG_LEVEL_HIKARI=ERROR
# LOG_LEVEL_MESSAGING=ERROR
# LOG_FORMAT=JSON

server:
  shutdown: graceful
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

spring:
  output:
    ansi:
      enabled: never

  messages:
    use-code-as-default-message: false

  datasource:
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      pool-name: UserServiceHikariCP
      auto-commit: false
      connection-test-query: SELECT 1

  jpa:
    properties:
      hibernate:
        jdbc:
          batch_size: 100
          fetch_size: 50
          time_zone: UTC
        query:
          in_clause_parameter_padding: true
          fail_on_pagination_over_collection_fetch: true
          plan_cache_max_size: 2048

  data:
    redis:
      connect-timeout: 2000ms
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4
        shutdown-timeout: 100ms

  rabbitmq:
    listener:
      simple:
        prefetch: 10
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attempts: 3
          max-interval: 10000ms
          multiplier: 2.0

iqscaffold:
  database:
    url: ${IQSCAFFOLD_DATABASE_URL}
    username: ${IQSCAFFOLD_DATABASE_USERNAME}
    password: ${IQSCAFFOLD_DATABASE_PASSWORD}
    pool:
      maximum-size: 50
      minimum-idle: 10

  cache:
    redis:
      host: ${IQSCAFFOLD_CACHE_REDIS_HOST}
      password: ${IQSCAFFOLD_CACHE_REDIS_PASSWORD}
      pool:
        max-active: 32
        max-idle: 16
        min-idle: 4
      key-prefix: "iqscaffold:auth:production"
      default-ttl: PT15M

  messaging:
    rabbitmq:
      host: ${IQSCAFFOLD_MESSAGING_RABBITMQ_HOST}
      username: ${IQSCAFFOLD_MESSAGING_RABBITMQ_USERNAME}
      password: ${IQSCAFFOLD_MESSAGING_RABBITMQ_PASSWORD}
      listener:
        simple:
          prefetch: 10
          default-requeue-rejected: false
          retry:
            enabled: true
            initial-interval: PT1S
            max-attempts: 3
            max-interval: PT10S
            multiplier: 2.0

  auth:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
    security:
      password:
        encoder-strength: 14
        min-length: 12
      rate-limiting:
        login-attempts: 3
        lockout-duration: PT30M
    oauth2:
      enabled: ${IQSCAFFOLD_AUTH_OAUTH2_ENABLED:false}

  email:
    smtp:
      host: ${SMTP_HOST}
      username: ${SMTP_USERNAME}
      password: ${SMTP_PASSWORD}
    sender:
      from-email: ${EMAIL_FROM_EMAIL:noreply@iqkv.dev}
      from-name: ${EMAIL_FROM_NAME:IQ Key Value Platform}
      base-url: ${APP_BASE_URL:https://app.iqkv.dev}
      auth-base-url: ${AUTH_BASE_URL:https://auth.iqkv.dev}

  object-storage:
    endpoint: ${IQSCAFFOLD_OBJECTSTORAGE_ENDPOINT:https://s3.amazonaws.com}
    access-key: ${IQSCAFFOLD_OBJECTSTORAGE_ACCESS_KEY}
    secret-key: ${IQSCAFFOLD_OBJECTSTORAGE_SECRET_KEY}
    bucket-name: ${IQSCAFFOLD_OBJECTSTORAGE_BUCKET_NAME:user-avatars-production}
    region: ${IQSCAFFOLD_OBJECTSTORAGE_REGION:us-west-2}
    ssl: ${IQSCAFFOLD_OBJECTSTORAGE_SSL:true}

  observability:
    tracing:
      sampling-rate: 0.01
      endpoint: ${IQSCAFFOLD_OBSERVABILITY_TRACING_ENDPOINT:http://otel-collector:4317}
      batch-size: 1024
    metrics:
      custom-tags:
        environment: production
    logging:
      level: WARN
      format: json
      include-user-id: false

  liquibase:
    contexts: "!demo"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
    liquibase:
      enabled: false
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      environment: production
  tracing:
    sampling:
      probability: 0.01

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
  show-actuator: false
