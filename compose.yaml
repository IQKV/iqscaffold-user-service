services:
  # PostgreSQL Database for User Service
  postgres-user:
    extends:
      file: compose.base.yaml
      service: postgres-user

  # Redis for User Service
  redis-user:
    extends:
      file: compose.base.yaml
      service: redis-user

  # RabbitMQ for User Service
  rabbitmq-user:
    extends:
      file: compose.base.yaml
      service: rabbitmq-user

  # MinIO Object Storage for User Service
  minio-user:
    extends:
      file: compose.base.yaml
      service: minio-user

  # MinIO Client for bucket initialization
  minio-init-user:
    extends:
      file: compose.base.yaml
      service: minio-init-user

networks:
  user-service-network:
    name: iqscaffold-user-network-dev
    external: false

volumes:
  postgres_user_data:
    name: iqscaffold_user_postgres_data_dev
  redis_user_data:
    name: iqscaffold_user_redis_data_dev
  rabbitmq_user_data:
    name: iqscaffold_user_rabbitmq_data_dev
  minio_user_data:
    name: iqscaffold_user_minio_data_dev
